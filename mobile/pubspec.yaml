name: school_platform_app
description: Prototipo móvil de la plataforma escolar con datos ficticios.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.3
  intl: ^0.20.2
  shared_preferences: ^2.5.6
  http: 1.6.0
  mobile_scanner: 7.5.0
  flutter_secure_storage: 11.2.0
  local_auth: 3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # Generado por `dart run tool/sync_institution.dart` a partir de config/institution.json.
    - assets/institution/
    - assets/institution/branding/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
